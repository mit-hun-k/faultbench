[project]
name = "worldbench"
version = "0.0.1"
description = "Fake, stateful worlds with fault injection for testing tool-using AI agents. Exposed over MCP, asserted from pytest."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Mithun K" }]
keywords = ["ai-agents", "testing", "mcp", "simulation", "fault-injection", "pytest"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "mcp>=2",
  "faker>=25.0",
]

[project.optional-dependencies]
examples = ["pydantic-ai>=0.4"]

[project.entry-points.pytest11]
worldbench = "worldbench.pytest_plugin"

[project.scripts]
worldbench = "worldbench.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
