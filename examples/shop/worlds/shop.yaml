# Loadable as of milestone 2: World.load("examples/shop/worlds/shop.yaml").
# Tables are reached by record-type name, so records are named as collections
# (orders, refunds) and must be unique across the world.
name: shop
seed: 42

services:
  orders:
    records:
      orders:
        id: str
        customer_id: str
        total: float
        status: enum[placed, shipped, delivered, returned]
        placed_at: datetime
    seed:
      count: 50
    operations:
      get_order:   { kind: get,  record: orders }
      list_orders: { kind: list, record: orders, filter: [customer_id] }
      create_return:
        kind: custom
        handler: shop_rules.create_return

  payments:
    records:
      refunds:
        id: str
        order_id: ref[orders.orders]
        amount: float
        created_at: datetime
    operations:
      issue_refund: { kind: create, record: refunds }

faults:
  default:
    latency_ms: [50, 200]
  payments.issue_refund:
    latency_ms: [200, 3000]
    errors: { timeout: 0.10, http_500: 0.02 }
  orders.get_order:
    errors: { not_found_if_newer_than: 2h }   # an order placed <2h ago isn't visible (sync lag)
  # Rate limiting is supported too, e.g. cap refunds:
  # payments.issue_refund:
  #   rate_limit: { calls: 5, per_seconds: 60 }   # 6th call within 60s -> http_429
